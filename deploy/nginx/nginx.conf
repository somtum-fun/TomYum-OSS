# TomYum reverse proxy configuration (nginx).
#
# Replace example.com with your actual domain. SSL cert paths assume Certbot/Let's Encrypt.
# Reload nginx after changes: nginx -s reload
#
# Subdomains:
#   c, ce, c4, cho  - Bancho binary protocol (login + packet polling)
#   osu             - Web API (/web/*.php, in-game registration, osu!Direct)
#   a               - Avatars
#   api             - REST API (future: osu!lazer)
#   session         - Session frontend (future: plugin)
#   b               - Beatmaps (future: custom beatmap hosting)

# --- Bancho binary protocol + Web API ---

server {
    listen 443 ssl;
    server_name c.example.com ce.example.com c4.example.com cho.example.com
                osu.example.com api.example.com session.example.com b.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow large bodies for replays and beatmap uploads
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Bancho keeps long-polling connections open; increase timeouts
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}

# --- Avatars ---

server {
    listen 443 ssl;
    server_name a.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Adjust to match storage.providers.local.bucket in tomyum.yaml
    root /var/lib/tomyum/storage/avatars;

    # No-cache so avatar changes appear immediately
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma        "no-cache";
    add_header Expires       "0";

    location / {
        # Try exact path, then with image extensions, fallback to default
        try_files $uri $uri.png $uri.jpg $uri.gif $uri.jpeg $uri.jfif /default.png;
    }
}

# --- HTTP → HTTPS redirect for all subdomains ---

server {
    listen 80;
    server_name c.example.com ce.example.com c4.example.com cho.example.com
                osu.example.com a.example.com api.example.com
                session.example.com b.example.com;
    return 301 https://$host$request_uri;
}
