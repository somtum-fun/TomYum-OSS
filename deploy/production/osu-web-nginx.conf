# The website's front: static files and uploads from disk, the notification websocket to its
# server, everything else to octane (the `php` service). Same routing as osu-web's development
# nginx; runs as the image's `osuweb` user, hence port 8080 and the pid file in storage.
worker_processes auto;
daemon off;
pid /app/storage/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    client_max_body_size 32m;

    server {
        listen 8080 default_server;
        root /app/public;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;

        location / {
            try_files $uri @octane;
        }

        location /assets/ {
            expires 30d;
            try_files $uri @octane;
        }

        location /assets/images/flags/ {
            error_page 404 /images/flags/fallback.png;
        }

        # Uploads are data, never code.
        location ~ ^/uploads/.*\.php$ {
            return 404;
        }

        location = /home/notifications/feed {
            set $notifications http://notification-server:2345;
            proxy_pass $notifications;
        }

        location @octane {
            set $octane http://php:8000;
            proxy_pass $octane;
        }
    }
}
