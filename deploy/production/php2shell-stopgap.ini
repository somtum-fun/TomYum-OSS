; php2shell stopgap — CVE-2026-109618 / CVE-2026-109619 (session.upload_progress use-after-free).
; Disables the only known attack vector (the PHP_SESSION_UPLOAD_PROGRESS multipart field) until the
; osu-web image is rebuilt on patched PHP (>= 8.5.12). Mounted read-only into every PHP service via
; the x-osu-web anchor in docker-compose.yml. Remove this file and its mount once on patched PHP.
session.upload_progress.enabled = Off
